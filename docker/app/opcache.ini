; Production bytecode cache. Not loaded in the dev image, so edited files
; take effect immediately during development.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000

; Source is baked into the image and never changes at runtime, so timestamp
; checks are pure overhead. A deploy replaces the container.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

opcache.save_comments = 1
opcache.fast_shutdown = 1
opcache.jit = tracing
opcache.jit_buffer_size = 64M
