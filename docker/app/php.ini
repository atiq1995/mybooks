; ---------------------------------------------------------------------------
; My Books — PHP settings common to every environment.
;
; Money never touches float, so precision settings here affect only
; incidental arithmetic. brick/math + brick/money do the financial work.
; ---------------------------------------------------------------------------

memory_limit = 512M
max_execution_time = 120

; Uploads: receipts and bank statements. Kept modest on purpose; large
; imports go through chunked upload rather than a bigger limit.
upload_max_filesize = 25M
post_max_size = 30M
max_file_uploads = 20

; Never leak stack traces or paths to a browser. Laravel renders errors.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; Timezone is UTC everywhere. Organisation-local display is applied in PHP
; from the organisation's configured timezone, never by the server default.
date.timezone = UTC

; Sessions are Redis-backed and configured by Laravel; these are hardening
; defaults in case a native session is ever created.
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

; Do not advertise the runtime.
expose_php = Off

; Deterministic serialisation of large decimals in var_export/json contexts.
serialize_precision = -1

; ---------------------------------------------------------------------------
; Opcache for the CLI too. On a Windows bind mount every autoloaded file is a
; slow filesystem round-trip; caching compiled bytecode makes the test suite
; several times faster. Timestamps ARE validated here (revalidate_freq = 0), so
; an edited file takes effect immediately. The production image overrides this
; with validate_timestamps = 0, because there the source never changes.
; ---------------------------------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
; Re-check a file's mtime at most every 2s. At 0, every include stats the
; file — and a stat through a Windows bind mount is milliseconds, times a
; thousand files, times every test. Two seconds is invisible to a developer
; and removes most of that cost.
opcache.revalidate_freq = 2
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000

; Same reasoning: cache resolved paths so autoloading is not a filesystem
; round-trip per class.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
